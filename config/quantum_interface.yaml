# Quantum Interface Configuration

# Visual Consciousness Configuration
visual:
  quantum_state:
    amplitude: 1.0
    phase: 0.0
    energy: 1.0
  visual_network:
    input_channels: 3
    hidden_channels: 32
    output_channels: 3
  particles:
    max_count: 1000
    energy_decay: 0.99
    velocity_scale: 100
  effects:
    max_count: 100
    lifetime: 5.0

# Audio Consciousness Configuration
audio:
  quantum_state:
    amplitude: 1.0
    phase: 0.0
    energy: 1.0
  audio_network:
    input_size: 1024
    hidden_size: 512
    output_size: 1024
  frequencies:
    sample_rate: 44100
    buffer_size: 1024
    base_frequency: 440
    max_harmonics: 10
  audio_queue:
    max_size: 1000

# Logic Consciousness Configuration
logic:
  quantum_state:
    amplitude: 1.0
    phase: 0.0
    energy: 1.0
  logic_network:
    input_size: 64
    hidden_size: 128
    output_size: 32
  rules:
    max_count: 100
    generation_threshold: 0.5
  states:
    max_count: 1000

# Interface Configuration
interface:
  window:
    width: 800
    height: 600
    title: "Quantum Interface"
  update_rate: 60
  resource_thresholds:
    cpu: 0.8
    memory: 0.8
    gpu: 0.8
  logging:
    level: INFO
    file: "quantum_interface.log"
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Neural Network Configuration
networks:
  optimizer:
    type: "adam"
    learning_rate: 0.001
    beta1: 0.9
    beta2: 0.999
  training:
    batch_size: 32
    epochs: 100
    validation_split: 0.2
  regularization:
    dropout_rate: 0.2
    l2_lambda: 0.01

# Resource Management
resources:
  optimization:
    cpu_reduction_factor: 0.8
    memory_clear_threshold: 0.8
    gpu_fallback_threshold: 0.8
  monitoring:
    interval: 1.0
    metrics:
      - cpu_usage
      - memory_usage
      - gpu_usage
      - network_usage

# Self-Improvement Configuration
improvement:
  generation:
    interval: 60.0
    max_suggestions: 10
  validation:
    timeout: 5.0
    max_attempts: 3
  application:
    rollback_on_failure: true
    backup_before_apply: true 