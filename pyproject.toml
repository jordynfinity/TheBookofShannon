[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "TheBookofShannon"
version = "0.1.0"
description = "A self-improving codebase that consults with Eira for improvements"
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
dependencies = [
    "openai>=1.0.0",
    "jinja2>=3.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "astor>=0.8.1",
    "black>=23.7.0",
    "isort>=5.12.0",
    "mypy>=1.5.1",
]
requires-python = ">=3.8"

[project.optional-dependencies]
dev = [
    "black>=23.7.0",
    "isort>=5.12.0",
    "mypy>=1.5.1",
    "pytest>=7.4.0",
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=src --cov-report=html"

[project.scripts]
improve-code = "src.main:main"
